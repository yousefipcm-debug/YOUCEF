<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clean Content">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262629" media="(prefers-color-scheme: dark)">
<title>Clean Content</title>
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: a macOS window — frosted source-list sidebar, toolbar, inset list; the player view replaces the list inside the same window */
:root{
  --desk:#e6e7ec; --window:#ffffff; --sidebar:rgba(236,236,240,.86); --bar:rgba(246,246,248,.92);
  --group:#ffffff; --groupbg:#f5f5f7; --sep:rgba(60,60,67,.14); --hover:rgba(0,0,0,.05); --sel:rgba(0,0,0,.08);
  --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#a1a1a6; --accent:#007aff; --accent-ink:#ffffff;
  --green:#28a745; --orange:#e5820a; --red:#ff3b30; --field:#ffffff; --fieldline:rgba(0,0,0,.14);
  --shadow:0 24px 60px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.18);
  --ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --desk:#0d0d10; --window:#1e1e20; --sidebar:rgba(40,40,44,.88); --bar:rgba(38,38,41,.94);
  --group:#2a2a2d; --groupbg:#1e1e20; --sep:rgba(255,255,255,.1); --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.1);
  --fg:#f5f5f7; --fg2:#a1a1a6; --fg3:#6e6e73; --accent:#0a84ff; --accent-ink:#ffffff;
  --green:#32d74b; --orange:#ff9f0a; --red:#ff453a; --field:#1c1c1e; --fieldline:rgba(255,255,255,.14);
  --shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.14); color-scheme:dark }}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--fg);font:13px/1.45 var(--ui);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.window{max-width:1180px;margin:0 auto;background:var(--window);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:min(760px,calc(100vh - 40px))}
.window.focus{grid-template-columns:minmax(0,1fr)}
.window.focus .sidebar{display:none}
.sidebar{grid-row:1/3;background:var(--sidebar);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border-right:.5px solid var(--sep);display:flex;flex-direction:column;padding:12px 10px}
.lights{display:flex;gap:8px;padding:4px 6px 18px}
.lights i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px 8px;font:600 14px var(--display)}
.brand img{width:26px;height:26px}
.sect{font-size:11px;font-weight:600;color:var(--fg3);padding:10px 10px 4px}
.src{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:6px;padding:5px 10px;cursor:default;text-align:left;font-size:13px}
.src:hover{background:var(--hover)}
.src[aria-current=true]{background:var(--sel);font-weight:600}
.src svg{width:16px;height:16px;flex:none;color:var(--accent)}
.src .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .cnt{color:var(--fg3);font-variant-numeric:tabular-nums;font-size:12px}
.src.np svg{color:var(--red)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 3px}
.side-foot{margin-top:auto;padding:12px 10px 2px;border-top:.5px solid var(--sep);display:grid;gap:8px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg2)}
.kv b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.links{display:flex;gap:12px;font-size:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-size:12px}

.toolbar{background:var(--bar);border-bottom:.5px solid var(--sep);display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:52px;position:sticky;top:0;z-index:5;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.toolbar h1{font:600 15px/1.2 var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar h1 small{display:block;font:400 11px var(--ui);color:var(--fg2);overflow:hidden;text-overflow:ellipsis}
.searchf{display:flex;align-items:center;gap:6px;background:var(--hover);border-radius:7px;padding:4px 8px;width:220px;max-width:36vw}
.searchf svg{width:13px;height:13px;color:var(--fg2);flex:none}
.searchf input{border:0;background:transparent;outline:none;width:100%;min-width:0;font-size:13px}
.tbtn{border:0;background:transparent;border-radius:6px;min-width:32px;height:28px;padding:0 6px;display:inline-grid;place-items:center;cursor:default;color:var(--fg2)}
.tbtn:hover{background:var(--hover);color:var(--fg)}
.tbtn[aria-pressed=true]{color:var(--accent)}
.tbtn svg{width:17px;height:17px}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:transparent;color:var(--accent);font-size:13px;padding:4px 6px;border-radius:6px;cursor:default}
.back:hover{background:var(--hover)}
.back svg{width:14px;height:14px}

.content{background:var(--groupbg);padding:22px 24px 40px;min-width:0;overflow:auto}
.lead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.lead h2{font:700 26px/1.1 var(--display);letter-spacing:-.01em;margin:0}
.lead p{margin:0;color:var(--fg2)}

/* list */
.group{background:var(--group);border-radius:10px;box-shadow:0 0 0 .5px var(--sep);overflow:hidden}
.item{display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;position:relative}
.item+.item::before{content:"";position:absolute;top:0;left:156px;right:0;border-top:.5px solid var(--sep)}
.item:hover{background:var(--hover)}
.item.now{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tile{width:128px;aspect-ratio:16/9;max-width:100%;border-radius:7px;position:relative;display:grid;place-items:center;color:#fff;border:0;padding:0;cursor:pointer;overflow:hidden;background-size:cover;background-position:center;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.tile .pl{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;opacity:.9;transition:transform .15s}
.tile:hover .pl{transform:scale(1.1)}
.tile .pl::after{content:"";border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.tile .d{position:absolute;right:5px;bottom:5px;font:500 10px var(--mono);background:rgba(0,0,0,.7);padding:0 4px;border-radius:3px}
.tile .tbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3)}
.tile .tbar i{display:block;height:100%;background:#ff3b30}
.info{min-width:0;display:grid;gap:3px}
.ttl{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere;display:flex;gap:6px;align-items:center;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.ttl .pin{color:var(--orange);flex:none}
.sub{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--fg2);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.badge.watching::before{background:var(--orange)} .badge.done::before{background:var(--green)}
.note{color:var(--fg2);font-size:12px;margin:0;overflow-wrap:anywhere}
.side{display:flex;align-items:center;gap:6px}
.capsule{border:0;border-radius:999px;padding:4px 12px;font-weight:600;font-size:12px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;cursor:pointer}
.capsule.gray{background:var(--hover);color:var(--accent)}
.capsule:hover{filter:brightness(1.08)}
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:210px;background:var(--bar);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.22),0 0 0 .5px var(--sep);padding:5px;display:grid}
.menu button,.menu a{border:0;background:transparent;text-align:left;padding:4px 10px;border-radius:5px;font-size:13px;color:var(--fg);text-decoration:none;cursor:default}
.menu button:hover,.menu a:hover{background:var(--accent);color:var(--accent-ink)}
.menu hr{border:0;border-top:.5px solid var(--sep);margin:4px 6px}
.menu .destructive{color:var(--red)}
.inline{grid-column:2/4;background:var(--groupbg);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:inset 0 0 0 .5px var(--sep)}
.field{background:var(--field);border:.5px solid var(--fieldline);border-radius:6px;padding:4px 8px;font-size:13px;box-shadow:0 .5px 1px rgba(0,0,0,.06)}
.field:focus{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:0}
.pbtn{border:.5px solid var(--fieldline);background:var(--field);border-radius:6px;padding:3px 11px;font-size:13px;cursor:default;box-shadow:0 .5px 1px rgba(0,0,0,.08);white-space:nowrap}
.pbtn.default{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.pbtn.destructive{background:var(--red);color:#fff;border-color:transparent}
.empty{padding:56px 20px;text-align:center;color:var(--fg2);display:grid;gap:8px;justify-items:center}
.empty svg{width:44px;height:44px;color:var(--fg3)}
.empty b{color:var(--fg);font:600 17px var(--display)}
.empty span{max-width:46ch}

/* player view */
.player{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.window.focus .player{grid-template-columns:minmax(0,1fr) 300px}
.stage{display:grid;gap:14px;min-width:0}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.screen iframe,.screen #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover{position:absolute;inset:0;background:rgba(10,10,12,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#f5f5f7;display:grid;place-items:center;text-align:center;padding:20px;z-index:2}
.cover .in{display:grid;gap:12px;justify-items:center;max-width:420px}
.cover b{font:600 18px var(--display)}
.cover p{margin:0;color:#c7c7cc;font-size:13px}
.cover .big{width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.18);display:grid;place-items:center;cursor:pointer}
.cover .big:hover{background:rgba(255,255,255,.28)}
.cover .big::after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.cover .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cover .pbtn{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.cover .pbtn.default{background:var(--accent)}
.np-title{font:700 20px/1.25 var(--display);margin:0;overflow-wrap:anywhere}
.np-sub{color:var(--fg2);display:flex;gap:10px;flex-wrap:wrap}
.track{display:grid;gap:4px}
.track .bar{height:4px;background:var(--sep);border-radius:9px;overflow:hidden}
.track .bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.track .t{display:flex;justify-content:space-between;color:var(--fg2);font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--hover);border-radius:7px;padding:2px}
.seg button{border:0;background:transparent;border-radius:5px;padding:2px 9px;font-size:12px;cursor:default;color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--field);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.panel{background:var(--group);border-radius:10px;box-shadow:0 0 0 .5px var(--sep);display:grid}
.panel h3{margin:0;padding:12px 14px 8px;font:600 13px var(--display);display:flex;justify-content:space-between;align-items:baseline}
.panel h3 small{font:400 12px var(--ui);color:var(--fg2)}
.addnote{display:flex;gap:6px;padding:0 14px 12px;align-items:center}
.addnote .field{flex:1;min-width:0}
.notes{display:grid;max-height:340px;overflow:auto}
.nrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 14px;border-top:.5px solid var(--sep)}
.nrow .ts{border:0;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border-radius:5px;padding:0 6px;font:500 12px var(--mono);cursor:pointer}
.nrow p{margin:0;overflow-wrap:anywhere}
.nrow .x{border:0;background:none;color:var(--fg3);cursor:pointer;font-size:14px;line-height:1}
.nrow .x:hover{color:var(--red)}
.nempty{padding:4px 14px 14px;color:var(--fg2);font-size:12px}
.upnext .item{grid-template-columns:96px minmax(0,1fr);gap:10px;padding:8px 12px}
.upnext .item+.item::before{left:118px}
.upnext .tile{width:96px}
.keys{color:var(--fg3);font-size:11px;padding:0 14px 12px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);display:grid;place-items:start center;padding:72px 16px 16px;z-index:50}
.sheet{width:min(480px,100%);background:var(--window);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 .5px var(--sep);padding:20px;display:grid;gap:14px}
.sheet h3{margin:0;font:600 15px var(--display);text-align:center}
.sheet .hint{margin:-8px 0 0;text-align:center;color:var(--fg2);font-size:12px}
.preview{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:center;background:var(--groupbg);border-radius:8px;padding:8px}
.preview .tile{width:112px;cursor:default}
.preview b{display:block;overflow-wrap:anywhere}
.form{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 10px;align-items:center}
.form label{text-align:right;color:var(--fg2);font-size:13px}
.form .field{width:100%}
.msg{font-size:12px;color:var(--fg2);min-height:1.4em}
.msg.err{color:var(--red)}
.sheet .btns{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 24px rgba(0,0,0,.2),0 0 0 .5px var(--sep);border-radius:999px;padding:7px 16px;font-size:13px;z-index:60}
@media (prefers-reduced-motion:no-preference){.sheet{animation:drop .22s ease-out}@keyframes drop{from{transform:translateY(-14px);opacity:.4}}}

@media (max-width:1000px){.player,.window.focus .player{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  body{padding-inline:0;padding-block:0}
  .window{grid-template-columns:1fr;min-height:100vh;border-radius:0;box-shadow:none}
  .sidebar{grid-row:auto;border-right:0;border-bottom:.5px solid var(--sep);padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .lights,.brand{display:none}
  .srcs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
  .srcs .sect{display:none}
  .src{width:auto;flex:none}
  .side-foot{display:flex;flex-wrap:wrap;gap:4px 14px;border-top:0;padding:8px 10px 0;margin-top:0}
  .content{padding:14px 12px 32px}
  .item{grid-template-columns:104px minmax(0,1fr);gap:10px}
  .item+.item::before{left:128px}
  .tile{width:104px}
  .item>.side{grid-column:1/3;justify-content:flex-end}
  .inline{grid-column:1/3}
  .searchf{width:140px}
  .screen{border-radius:0;margin-inline:-12px}
}
@media (max-width:420px){.form{grid-template-columns:1fr}.form label{text-align:left}}
</style>
</head>
<body>
<div class="window" id="win">
  <aside class="sidebar">
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="brand"><img src="icons/logo.svg" alt="" width="26" height="26"><span>Clean Content</span></div>
    <nav class="srcs" id="srcs" aria-label="Library"></nav>
    <div class="side-foot">
      <div class="kv"><span>Time left</span><b id="sLeft">0m</b></div>
      <div class="kv"><span>Watched this week</span><b id="sWeek">0m</b></div>
      <div class="links"><button class="linkbtn" id="exportBtn">Back up…</button><button class="linkbtn" id="importBtn">Restore…</button><input type="file" id="importFile" accept="application/json,.json" hidden></div>
    </div>
  </aside>

  <header class="toolbar">
    <button class="back" id="backBtn" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg><span id="backLbl">Library</span></button>
    <h1 id="tbTitle">Clean Content<small id="tbSub">Your videos, no feed</small></h1>
    <div class="searchf" id="searchBox">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5" stroke-linecap="round"/></svg>
      <input id="q" type="text" placeholder="Search" aria-label="Search videos">
    </div>
    <button class="tbtn" id="focusBtn" title="Focus mode (hide sidebar)" aria-pressed="false" aria-label="Focus mode"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button>
    <button class="tbtn" id="addBtn" title="Add video (⌘N)" aria-label="Add video"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 2.5v11M2.5 8h11"/></svg></button>
  </header>

  <main class="content">
    <section id="libView">
      <div class="lead"><h2 id="viewTitle">Up Next</h2><p id="viewSub"></p></div>
      <div id="list"></div>
    </section>

    <section id="playView" class="player" hidden>
      <div class="stage">
        <div class="screen" id="screen">
          <div id="yt"></div>
          <div class="cover" id="cover" hidden></div>
        </div>
        <div>
          <h2 class="np-title" id="npTitle"></h2>
          <div class="np-sub" id="npSub"></div>
        </div>
        <div class="track"><div class="bar"><i id="npBar" style="width:0%"></i></div><div class="t mono"><span id="npPos">0:00</span><span id="npLeft"></span></div></div>
        <div class="controls">
          <div class="seg" id="speed" role="group" aria-label="Playback speed"></div>
          <button class="pbtn" id="npDone">Mark as Finished</button>
          <button class="pbtn" id="npPin">Pin to Top</button>
        </div>
      </div>
      <div class="stage">
        <div class="panel">
          <h3>Notes <small id="nCount"></small></h3>
          <form class="addnote" id="noteForm" autocomplete="off">
            <span class="mono" id="noteAt" style="color:var(--fg2);font-size:12px">0:00</span>
            <input class="field" id="noteText" type="text" placeholder="Write what you learned here" aria-label="Note">
            <button class="pbtn default" type="submit">Add</button>
          </form>
          <div class="notes" id="notes"></div>
          <div class="keys">Keys: Space play/pause · ← → 10 s · N new note</div>
        </div>
        <div class="panel upnext">
          <h3>Up Next</h3>
          <div id="upnext"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="addForm" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Add Video</h3>
    <p class="hint">Save it now, watch it on purpose later.</p>
    <div class="preview" id="preview" hidden><div class="tile" id="pvTile"></div><div><b id="pvTitle"></b><span class="sub" id="pvSub"></span></div></div>
    <div class="form">
      <label for="fUrl">Link</label><input class="field" type="text" id="fUrl" placeholder="youtube.com/watch?v=…" required>
      <label for="fTitle">Title</label><input class="field" type="text" id="fTitle" placeholder="Filled in automatically">
      <label for="fList">Playlist</label><input class="field" type="text" id="fList" list="lists" placeholder="Engineering, Business…"><datalist id="lists"></datalist>
      <label for="fNote">Why</label><input class="field" type="text" id="fNote" placeholder="Optional note to yourself">
    </div>
    <div class="msg" id="fMsg">Paste a YouTube link to start.</div>
    <div class="btns"><button type="button" class="pbtn" id="cancelAdd">Cancel</button><button type="submit" class="pbtn default">Add to Queue</button></div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const LS="cleanContent.v1";
  const state={videos:{},view:"next",list:"",q:"",menu:null,armed:null,playing:null};
  const SPEEDS=[1,1.25,1.5,1.75,2];
  let player=null, apiReady=false, apiWaiters=[], tick=null, lastT=null, dirty=false;

  const ICON={
    next:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4h7M3 8h7M3 12h4"/><path d="m11 10 3 2-3 2z" fill="currentColor"/></svg>',
    watching:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5" stroke-linecap="round"/></svg>',
    done:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="m5.3 8.2 1.8 1.8 3.6-3.8"/></svg>',
    all:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="m7 6 3 2-3 2z" fill="currentColor"/></svg>',
    np:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="6" width="2" height="6" rx="1"/><rect x="7" y="3" width="2" height="10" rx="1"/><rect x="12" y="5" width="2" height="7" rx="1"/></svg>',
    empty:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="38" height="28" rx="6"/><path d="m20 18 10 6-10 6z" fill="currentColor" stroke="none"/></svg>',
    more:'<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>',
    pin:'<svg class="pin" width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-label="Pinned"><path d="M8 1.5l2 4.3 4.6.5-3.4 3.1 1 4.6L8 11.6 3.8 14l1-4.6L1.4 6.3l4.6-.5z"/></svg>'
  };
  const VIEWS=[["next","Up Next"],["watching","In Progress"],["done","Finished"],["all","All Videos"]];

  /* ---------- helpers ---------- */
  function parseYT(raw){
    raw=(raw||"").trim(); if(!raw) return null;
    try{
      const u=new URL(/^https?:/i.test(raw)?raw:"https://"+raw);
      const h=u.hostname.replace(/^www\.|^m\./,"");
      let id=null;
      if(h==="youtu.be") id=u.pathname.slice(1).split("/")[0];
      else if(h.endsWith("youtube.com")||h.endsWith("youtube-nocookie.com")){
        if(u.searchParams.get("v")) id=u.searchParams.get("v");
        else{ const m=u.pathname.match(/\/(shorts|embed|live|v)\/([\w-]{6,})/); if(m) id=m[2]; }
      }
      if(!id||!/^[\w-]{6,20}$/.test(id)) return null;
      const t=u.searchParams.get("t")||u.searchParams.get("start")||"";
      let start=0;
      if(t){ const m=String(t).match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?/); if(m) start=(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0); }
      return {id,start};
    }catch(e){ return null; }
  }
  const fmt=sec=>{ sec=Math.max(0,Math.floor(sec||0)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`; };
  const fmtHM=sec=>{ const h=Math.floor(sec/3600),m=Math.round(sec%3600/60); return h?`${h}h ${m}m`:`${m}m`; };
  const hue=id=>{ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))>>>0; return h%360; };
  const today=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const weekStart=()=>{ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const nice=s=>s?new Date(s+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}):"";
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const statusOf=v=>v.done?"done":(v.progress>1?"watching":"todo");
  const thumb=vid=>`https://i.ytimg.com/vi/${vid}/mqdefault.jpg`;
  const tileBg=vid=>{ const h=hue(vid); return `background-image:url('${thumb(vid)}'),linear-gradient(140deg,hsl(${h} 62% 46%),hsl(${(h+35)%360} 58% 24%))`; };
  function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2400); }
  function addLog(v,delta){ const log=(v.log||[]).slice(); if(delta>0){ const td=today(),last=log[log.length-1]; if(last&&last.d===td) log[log.length-1]={d:td,s:last.s+delta}; else log.push({d:td,s:delta}); } return log.slice(-90); }

  /* ---------- storage (this browser) ---------- */
  function load(){ try{ state.videos=JSON.parse(localStorage.getItem(LS)||"{}")||{}; }catch(e){ state.videos={}; } }
  function persist(){ try{ localStorage.setItem(LS,JSON.stringify(state.videos)); }catch(e){ toast("Couldn't save. Your browser storage may be full or blocked."); } }
  function save(key,v,opts){ state.videos[key]=v; persist(); if(!(opts&&opts.quiet)) render(); }
  function del(key){ delete state.videos[key]; persist(); render(); }

  async function fetchMeta(vid){
    try{
      const r=await fetch(`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent("https://www.youtube.com/watch?v="+vid)}`);
      if(!r.ok) return null; const j=await r.json(); return {title:j.title,channel:j.author_name};
    }catch(e){ return null; }
  }

  /* ---------- library render ---------- */
  const all=()=>Object.entries(state.videos).map(([key,v])=>({key,...v}));
  const playlists=()=>[...new Set(all().map(v=>v.list).filter(Boolean))].sort();
  const queue=()=>all().filter(v=>!v.done).sort((a,b)=>((b.star?1:0)-(a.star?1:0))||((statusOf(b)==="watching")-(statusOf(a)==="watching"))||(a.order||0)-(b.order||0));

  function renderSidebar(){
    const vs=all(), pl=playlists();
    const n={next:vs.filter(v=>!v.done).length,watching:vs.filter(v=>statusOf(v)==="watching").length,done:vs.filter(v=>v.done).length,all:vs.length};
    const np=state.playing&&state.videos[state.playing];
    $("#srcs").innerHTML=
      (np?`<div class="sect">Now Playing</div><button class="src np" data-goplay aria-current="${!$("#playView").hidden}">${ICON.np}<span class="lbl">${esc(np.title)}</span></button>`:"")+
      `<div class="sect">Library</div>`+
      VIEWS.map(([k,l])=>`<button class="src" data-view="${k}" aria-current="${$("#playView").hidden&&!state.list&&state.view===k}">${ICON[k]}<span class="lbl">${l}</span><span class="cnt">${n[k]||""}</span></button>`).join("")+
      (pl.length?`<div class="sect">Playlists</div>`+pl.map(p=>`<button class="src" data-pl="${esc(p)}" aria-current="${$("#playView").hidden&&state.list===p}"><span class="dot" style="background:hsl(${hue(p)} 70% 55%)"></span><span class="lbl">${esc(p)}</span><span class="cnt">${vs.filter(v=>v.list===p&&!v.done).length||""}</span></button>`).join(""):"");
    $("#lists").innerHTML=pl.map(p=>`<option value="${esc(p)}">`).join("");
    const ws=weekStart();
    $("#sLeft").textContent=fmtHM(vs.filter(v=>!v.done).reduce((a,v)=>a+Math.max(0,(v.duration||0)-(v.progress||0)),0));
    $("#sWeek").textContent=fmtHM(vs.reduce((a,v)=>a+(v.log||[]).filter(l=>l.d>=ws).reduce((x,l)=>x+l.s,0),0));
  }

  function row(v,compact){
    const st=statusOf(v), pct=v.duration?Math.min(100,(v.progress||0)/v.duration*100):0;
    const label=st==="todo"?"Not started":st==="watching"?`${fmt((v.duration||0)-(v.progress||0))} left`:"Finished";
    const tile=`<button class="tile" style="${tileBg(v.vid)}" data-play="${v.key}" aria-label="Play ${esc(v.title)}"><span class="pl"></span>${v.duration?`<span class="d">${fmt(v.duration)}</span>`:""}${pct&&!v.done?`<span class="tbar"><i style="width:${pct}%"></i></span>`:""}</button>`;
    if(compact) return `<div class="item">${tile}<div class="info"><button class="ttl" data-play="${v.key}">${esc(v.title)}</button><div class="sub"><span class="badge ${st}">${label}</span></div></div></div>`;
    const menu=state.menu===v.key?`<div class="menu" role="menu">
        <button data-done="${v.key}" role="menuitem">${v.done?"Move Back to Up Next":"Mark as Finished"}</button>
        <button data-star="${v.key}" role="menuitem">${v.star?"Unpin":"Pin to Top"}</button>
        ${v.progress>0&&!v.done?`<button data-restart="${v.key}" role="menuitem">Start Over</button>`:""}
        <hr><a href="https://www.youtube.com/watch?v=${v.vid}" target="_blank" rel="noopener" role="menuitem">Open on YouTube</a>
        <hr><button class="destructive" data-askdel="${v.key}" role="menuitem">Delete…</button></div>`:"";
    const confirm=state.armed===v.key?`<div class="inline"><span>Delete “${esc(v.title)}” and its notes?</span><span style="flex:1"></span><button class="pbtn" data-canceldel>Cancel</button><button class="pbtn destructive" data-del="${v.key}">Delete</button></div>`:"";
    const nn=(v.notes||[]).length;
    return `<div class="item ${state.playing===v.key?"now":""}">
      ${tile}
      <div class="info">
        <button class="ttl" data-play="${v.key}">${v.star?ICON.pin:""}<span>${esc(v.title)}</span></button>
        <div class="sub"><span class="badge ${st}">${label}</span>${v.channel?`<span>${esc(v.channel)}</span>`:""}${v.list?`<span>${esc(v.list)}</span>`:""}${nn?`<span>${nn} ${nn===1?"note":"notes"}</span>`:""}<span>Added ${nice(v.addedAt)}</span></div>
        ${v.note?`<p class="note">${esc(v.note)}</p>`:""}
      </div>
      <div class="side">
        <button class="capsule ${st==="done"?"gray":""}" data-play="${v.key}">${st==="watching"?"Resume":st==="done"?"Replay":"Play"}</button>
        <div class="more"><button class="tbtn" data-menu="${v.key}" aria-label="More actions" aria-haspopup="menu" aria-expanded="${state.menu===v.key}">${ICON.more}</button>${menu}</div>
      </div>${confirm}
    </div>`;
  }

  function renderList(){
    let vs=all(), title;
    if(state.list){ vs=vs.filter(v=>v.list===state.list); title=state.list; }
    else{
      title=VIEWS.find(x=>x[0]===state.view)[1];
      if(state.view==="next") vs=vs.filter(v=>!v.done);
      if(state.view==="watching") vs=vs.filter(v=>statusOf(v)==="watching");
      if(state.view==="done") vs=vs.filter(v=>v.done);
    }
    if(state.q){ const q=state.q.toLowerCase(); vs=vs.filter(v=>[v.title,v.note,v.list,v.channel,...(v.notes||[]).map(n=>n.text)].join(" ").toLowerCase().includes(q)); }
    vs.sort((a,b)=>(!state.list&&state.view==="done")?(b.doneAt||"").localeCompare(a.doneAt||""):((a.done?1:0)-(b.done?1:0))||((b.star?1:0)-(a.star?1:0))||((statusOf(b)==="watching")-(statusOf(a)==="watching"))||(a.order||0)-(b.order||0));
    const secs=vs.filter(v=>!v.done).reduce((a,v)=>a+Math.max(0,(v.duration||0)-(v.progress||0)),0);
    $("#viewTitle").textContent=title;
    $("#viewSub").textContent=`${vs.length} ${vs.length===1?"video":"videos"}${secs?` · ${fmtHM(secs)} to watch`:""}`;
    const total=Object.keys(state.videos).length;
    $("#list").innerHTML=vs.length?`<div class="group">${vs.map(v=>row(v)).join("")}</div>`:
      `<div class="empty">${ICON.empty}<b>${total===0?"No Videos Yet":"Nothing Here"}</b><span>${total===0?"When you find a video worth your time, add it with the + button instead of watching it now. It plays here, with no recommendations around it.":state.q?"No videos match your search.":"Videos appear here as you watch and finish them."}</span>${total===0?'<button class="pbtn default" data-open-add>Add Video</button>':""}</div>`;
    if(!$("#playView").hidden) return;
    $("#tbTitle").firstChild.textContent="Clean Content";
    $("#tbSub").textContent=title;
  }
  function render(){ renderSidebar(); renderList(); if(state.playing&&!$("#playView").hidden) renderPlayerMeta(true); }

  /* ---------- player ---------- */
  function loadAPI(){
    if(window.YT&&window.YT.Player){ apiReady=true; return; }
    if(document.getElementById("ytapi")) return;
    window.onYouTubeIframeAPIReady=()=>{ apiReady=true; apiWaiters.splice(0).forEach(f=>f()); };
    const s=document.createElement("script"); s.id="ytapi"; s.src="https://www.youtube.com/iframe_api";
    s.onerror=()=>showCover("error"); document.head.appendChild(s);
  }
  const whenAPI=f=>apiReady?f():apiWaiters.push(f);

  function showLibrary(){
    flushProgress();
    if(player&&player.pauseVideo) try{ player.pauseVideo(); }catch(e){}
    $("#playView").hidden=true; $("#libView").hidden=false; $("#backBtn").hidden=true; $("#searchBox").hidden=false;
    render();
  }
  function showPlayerView(){
    $("#libView").hidden=true; $("#playView").hidden=false; $("#backBtn").hidden=false; $("#searchBox").hidden=true;
    $("#backLbl").textContent=state.list||VIEWS.find(x=>x[0]===state.view)[1];
  }

  function openPlayer(key){
    const v=state.videos[key]; if(!v) return;
    flushProgress();
    state.playing=key; state.menu=null; state.armed=null;
    showPlayerView(); hideCover();
    renderSidebar(); renderPlayerMeta(true);
    let start=v.done?0:Math.floor(v.progress||0);
    if(v.duration&&start>=v.duration-3) start=0;
    lastT=start;
    whenAPI(()=>{
      if(player){ try{ player.loadVideoById({videoId:v.vid,startSeconds:start}); player.setPlaybackRate(v.rate||1); }catch(e){} return; }
      player=new YT.Player("yt",{
        host:"https://www.youtube-nocookie.com", videoId:v.vid,
        playerVars:Object.assign({start,autoplay:1,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3},/^https?:$/.test(location.protocol)?{origin:location.origin,widget_referrer:location.href}:{}),
        events:{onReady:onReady,onStateChange:onState,onError:()=>showCover("error"),onPlaybackRateChange:e=>{ const cur=state.videos[state.playing]; if(cur){ cur.rate=e.data; save(state.playing,cur,{quiet:true}); renderSpeed(); } }}
      });
    });
    loadAPI();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function onReady(){ const v=state.videos[state.playing]; try{ if(v&&v.rate) player.setPlaybackRate(v.rate); player.playVideo(); }catch(e){} }

  function captureMeta(){
    const key=state.playing, v=state.videos[key]; if(!v||!player) return;
    let changed=false;
    try{
      const d=player.getDuration(); if(d>0&&Math.abs((v.duration||0)-d)>1){ v.duration=Math.round(d); changed=true; }
      const data=player.getVideoData&&player.getVideoData();
      if(data&&data.video_id===v.vid){
        if(data.title&&(v.autoTitle||!v.title)){ if(v.title!==data.title){ v.title=data.title; changed=true; } }
        if(data.author&&!v.channel){ v.channel=data.author; changed=true; }
      }
    }catch(e){}
    if(changed){ save(key,v,{quiet:true}); renderSidebar(); renderPlayerMeta(true); }
  }

  function onState(e){
    const S=YT.PlayerState;
    if(e.data===S.PLAYING){ hideCover(); captureMeta(); startTick(); }
    else if(e.data===S.PAUSED){ stopTick(); flushProgress(); showCover("paused"); }
    else if(e.data===S.ENDED){ stopTick(); finishCurrent(true); showCover("ended"); }
    else if(e.data===S.CUED){ captureMeta(); }
  }
  function startTick(){ stopTick(); try{ lastT=player.getCurrentTime(); }catch(e){} tick=setInterval(onTick,1000); }
  function stopTick(){ if(tick){ clearInterval(tick); tick=null; } }
  function onTick(){
    const key=state.playing, v=state.videos[key]; if(!v||!player) return;
    let t=0; try{ t=player.getCurrentTime(); }catch(e){ return; }
    const delta=t-(lastT??t);
    if(delta>0&&delta<5) v.log=addLog(v,delta);
    lastT=t;
    if(!v.done){ v.progress=t; }
    state.videos[key]=v; dirty=true;
    if(!v.duration) captureMeta();
    renderPlayerMeta(false);
    if(Math.floor(t)%5===0) flushProgress();
  }
  function flushProgress(){ if(dirty){ persist(); dirty=false; renderSidebar(); } }

  function finishCurrent(auto){
    const key=state.playing, v=state.videos[key]; if(!v) return;
    if(!v.done){
      v.done=true; v.doneAt=today(); if(v.duration) v.progress=v.duration;
      save(key,v,{quiet:true}); renderSidebar(); renderPlayerMeta(true);
    }
  }
  function nextInQueue(){ return queue().find(v=>v.key!==state.playing); }

  function showCover(kind){
    const c=$("#cover"), v=state.videos[state.playing], nx=nextInQueue();
    if(kind==="paused"){
      c.innerHTML=`<div class="in"><button class="big" data-resume aria-label="Resume"></button><b>Paused at ${fmt(v&&v.progress)}</b><p>Write down what you just learned while it's fresh.</p><div class="row"><button class="pbtn" data-focusnote>Add a Note</button></div></div>`;
    }else if(kind==="ended"){
      c.innerHTML=`<div class="in"><b>Finished</b><p>${esc(v&&v.title)}</p><div class="row"><button class="pbtn" data-replay>Replay</button>${nx?`<button class="pbtn default" data-play="${nx.key}">Play Next: ${esc(nx.title.length>34?nx.title.slice(0,32)+"…":nx.title)}</button>`:`<button class="pbtn default" data-goback>Back to Library</button>`}</div></div>`;
    }else{
      c.innerHTML=`<div class="in"><b>This video can't play here</b><p>The owner may block playback on other sites, or this page is opened as a file instead of from a web address. You can still watch it on YouTube.</p><div class="row"><a class="pbtn default" style="text-decoration:none" href="https://www.youtube.com/watch?v=${v?v.vid:""}" target="_blank" rel="noopener">Open on YouTube</a></div></div>`;
    }
    c.hidden=false;
  }
  function hideCover(){ $("#cover").hidden=true; }

  function renderSpeed(){
    const v=state.videos[state.playing]; const r=(v&&v.rate)||1;
    $("#speed").innerHTML=SPEEDS.map(s=>`<button data-rate="${s}" aria-pressed="${s===r}">${s}×</button>`).join("");
  }
  function renderPlayerMeta(full){
    const v=state.videos[state.playing]; if(!v) return;
    const pct=v.duration?Math.min(100,(v.progress||0)/v.duration*100):0;
    $("#npBar").style.width=pct+"%";
    $("#npPos").textContent=fmt(v.progress);
    $("#npLeft").textContent=v.duration?(v.done?"Finished":`-${fmt(v.duration-(v.progress||0))}`):"";
    $("#noteAt").textContent=fmt(v.progress);
    if(!full) return;
    $("#tbTitle").firstChild.textContent=v.title;
    $("#tbSub").textContent=v.channel||"Now playing";
    $("#npTitle").textContent=v.title;
    $("#npSub").innerHTML=[v.channel,v.list,v.note].filter(Boolean).map(esc).map(s=>`<span>${s}</span>`).join("");
    $("#npDone").textContent=v.done?"Move Back to Up Next":"Mark as Finished";
    $("#npPin").textContent=v.star?"Unpin":"Pin to Top";
    renderSpeed();
    const notes=(v.notes||[]).slice().sort((a,b)=>a.t-b.t);
    $("#nCount").textContent=notes.length?`${notes.length}`:"";
    $("#notes").innerHTML=notes.length?notes.map(n=>`<div class="nrow"><button class="ts" data-seek="${n.t}" title="Jump to ${fmt(n.t)}">${fmt(n.t)}</button><p>${esc(n.text)}</p><button class="x" data-delnote="${n.id}" aria-label="Delete note">×</button></div>`).join(""):`<div class="nempty">Notes are stamped with the current time. Tap a time to jump back to that moment.</div>`;
    const up=queue().filter(x=>x.key!==state.playing).slice(0,4);
    $("#upnext").innerHTML=up.length?`<div>${up.map(x=>row(x,true)).join("")}</div>`:`<div class="nempty">Nothing else in your queue.</div>`;
  }

  /* ---------- sheet ---------- */
  let pvToken=0;
  function openSheet(){ $("#scrim").hidden=false; $("#fMsg").className="msg"; $("#fMsg").textContent="Paste a YouTube link to start."; $("#preview").hidden=true; setTimeout(()=>$("#fUrl").focus(),30); }
  function closeSheet(){ $("#scrim").hidden=true; $("#addForm").reset(); $("#preview").hidden=true; }
  $("#addBtn").addEventListener("click",openSheet);
  $("#cancelAdd").addEventListener("click",closeSheet);
  $("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") closeSheet(); });
  $("#fUrl").addEventListener("input",async()=>{
    const raw=$("#fUrl").value, p=parseYT(raw), m=$("#fMsg"), my=++pvToken;
    m.className="msg"+(raw&&!p?" err":"");
    if(!p){ $("#preview").hidden=true; m.textContent=raw?"That doesn't look like a YouTube video link yet.":"Paste a YouTube link to start."; return; }
    if(state.videos["yt-"+p.id]){ m.className="msg err"; m.textContent="This video is already in your library."; }
    else m.textContent="Looking up the video…";
    $("#pvTile").setAttribute("style",tileBg(p.id)); $("#pvTitle").textContent=""; $("#pvSub").textContent=""; $("#preview").hidden=false;
    const meta=await fetchMeta(p.id); if(my!==pvToken) return;
    if(meta){ $("#pvTitle").textContent=meta.title; $("#pvSub").textContent=meta.channel||""; if(!$("#fTitle").value) $("#fTitle").placeholder=meta.title; $("#fTitle").dataset.auto=meta.title; $("#fTitle").dataset.channel=meta.channel||""; if(!state.videos["yt-"+p.id]) m.textContent="Ready to add."; }
    else{ $("#pvTitle").textContent="Title will appear when you play it"; if(!state.videos["yt-"+p.id]) m.textContent="Ready to add. You can type a title, or it fills in on first play."; }
  });
  $("#addForm").addEventListener("submit",e=>{
    e.preventDefault();
    const p=parseYT($("#fUrl").value), m=$("#fMsg");
    if(!p){ m.className="msg err"; m.textContent="Paste a YouTube video link (youtube.com/watch?v=… or youtu.be/…)."; return; }
    const key="yt-"+p.id;
    if(state.videos[key]){ m.className="msg err"; m.textContent="This video is already in your library."; return; }
    const typed=$("#fTitle").value.trim(), auto=$("#fTitle").dataset.auto||"";
    const orders=all().map(v=>v.order||0);
    save(key,{vid:p.id,title:typed||auto||"Untitled video",autoTitle:!typed,channel:$("#fTitle").dataset.channel||"",duration:0,progress:p.start||0,list:$("#fList").value.trim(),note:$("#fNote").value.trim(),done:false,star:false,addedAt:today(),order:(orders.length?Math.max(...orders):0)+1,log:[],notes:[],rate:1});
    delete $("#fTitle").dataset.auto; delete $("#fTitle").dataset.channel; $("#fTitle").placeholder="Filled in automatically";
    closeSheet(); toast("Added to Up Next");
    if(!state.list&&state.view==="done") state.view="next";
    render();
  });
  $("#q").addEventListener("input",e=>{ state.q=e.target.value; renderList(); });

  /* ---------- notes ---------- */
  $("#noteForm").addEventListener("submit",e=>{
    e.preventDefault();
    const text=$("#noteText").value.trim(); if(!text) return;
    const key=state.playing, v=state.videos[key]; if(!v) return;
    let t=v.progress||0; try{ t=player.getCurrentTime(); }catch(err){}
    v.notes=(v.notes||[]).concat({id:Date.now().toString(36),t:Math.floor(t),text});
    $("#noteText").value=""; save(key,v,{quiet:true}); renderPlayerMeta(true);
  });

  /* ---------- backup ---------- */
  $("#exportBtn").addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify({app:"Clean Content",version:1,exported:new Date().toISOString(),videos:state.videos},null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`clean-content-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast("Backup file saved");
  });
  $("#importBtn").addEventListener("click",()=>$("#importFile").click());
  $("#importFile").addEventListener("change",async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const j=JSON.parse(await f.text()); const vids=j.videos||j; let n=0;
      for(const [k,v] of Object.entries(vids)){ if(v&&v.vid&&/^yt-[\w-]+$/.test(k)){ const cur=state.videos[k]; if(!cur||(v.progress||0)>(cur.progress||0)) { state.videos[k]=v; n++; } } }
      persist(); render(); toast(`Restored ${n} ${n===1?"video":"videos"}`);
    }catch(err){ toast("That file isn't a Clean Content backup."); }
    e.target.value="";
  });

  /* ---------- clicks & keys ---------- */
  document.addEventListener("click",e=>{
    const t=e.target.closest("button");
    if(!t){ if(state.menu&&!e.target.closest(".menu")){ state.menu=null; renderList(); } return; }
    const d=t.dataset;
    if(d.openAdd!==undefined){ openSheet(); return; }
    if(d.goplay!==undefined){ showPlayerView(); renderSidebar(); renderPlayerMeta(true); return; }
    if(d.view){ state.view=d.view; state.list=""; state.menu=null; showLibrary(); return; }
    if(d.pl!==undefined){ state.list=d.pl; state.menu=null; showLibrary(); return; }
    if(d.play){ openPlayer(d.play); return; }
    if(d.resume!==undefined){ try{ player.playVideo(); }catch(err){} return; }
    if(d.replay!==undefined){ const v=state.videos[state.playing]; if(v){ hideCover(); try{ player.seekTo(0,true); player.playVideo(); }catch(err){} } return; }
    if(d.goback!==undefined){ showLibrary(); return; }
    if(d.focusnote!==undefined){ $("#noteText").focus(); return; }
    if(d.rate){ const r=+d.rate; try{ player.setPlaybackRate(r); }catch(err){} const v=state.videos[state.playing]; if(v){ v.rate=r; save(state.playing,v,{quiet:true}); renderSpeed(); } return; }
    if(d.seek){ try{ player.seekTo(+d.seek,true); player.playVideo(); }catch(err){} return; }
    if(d.delnote){ const v=state.videos[state.playing]; if(v){ v.notes=(v.notes||[]).filter(n=>n.id!==d.delnote); save(state.playing,v,{quiet:true}); renderPlayerMeta(true); } return; }
    if(d.menu){ state.menu=state.menu===d.menu?null:d.menu; renderList(); return; }
    if(d.canceldel!==undefined){ state.armed=null; renderList(); return; }
    const key=d.done||d.star||d.del||d.askdel||d.restart; const v=key&&state.videos[key]; if(!v) return;
    state.menu=null;
    if(d.askdel){ state.armed=key; renderList(); return; }
    if(d.del){ state.armed=null; if(state.playing===key){ state.playing=null; if(player) try{ player.stopVideo(); }catch(err){} showLibrary(); } del(key); return; }
    if(d.restart){ save(key,{...v,progress:0}); return; }
    if(d.done){ if(v.done) save(key,{...v,done:false,doneAt:null}); else save(key,{...v,done:true,doneAt:today(),progress:v.duration||v.progress||0}); return; }
    if(d.star){ save(key,{...v,star:!v.star}); return; }
  });
  $("#npDone").addEventListener("click",()=>{ const k=state.playing,v=state.videos[k]; if(!v) return; if(v.done){ v.done=false; v.doneAt=null; save(k,v,{quiet:true}); } else finishCurrent(false); render(); });
  $("#npPin").addEventListener("click",()=>{ const k=state.playing,v=state.videos[k]; if(!v) return; v.star=!v.star; save(k,v,{quiet:true}); render(); });
  $("#backBtn").addEventListener("click",showLibrary);
  $("#focusBtn").addEventListener("click",()=>{ const on=$("#win").classList.toggle("focus"); $("#focusBtn").setAttribute("aria-pressed",on); try{ localStorage.setItem(LS+".focus",on?"1":""); }catch(e){} });

  document.addEventListener("keydown",e=>{
    const typing=/INPUT|TEXTAREA/.test(document.activeElement&&document.activeElement.tagName);
    if(e.key==="Escape"){ if(!$("#scrim").hidden) closeSheet(); else if(state.menu){ state.menu=null; renderList(); } else if(typing) document.activeElement.blur(); return; }
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="n"&&$("#scrim").hidden){ e.preventDefault(); openSheet(); return; }
    if(typing||$("#playView").hidden||!player||!$("#scrim").hidden) return;
    try{
      if(e.key===" "||e.key.toLowerCase()==="k"){ e.preventDefault(); player.getPlayerState()===1?player.pauseVideo():player.playVideo(); }
      else if(e.key==="ArrowLeft"||e.key.toLowerCase()==="j"){ e.preventDefault(); player.seekTo(Math.max(0,player.getCurrentTime()-10),true); }
      else if(e.key==="ArrowRight"||e.key.toLowerCase()==="l"){ e.preventDefault(); player.seekTo(player.getCurrentTime()+10,true); }
      else if(e.key.toLowerCase()==="n"){ e.preventDefault(); $("#noteText").focus(); }
    }catch(err){}
  });
  window.addEventListener("pagehide",flushProgress);
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) flushProgress(); });

  /* ---------- boot ---------- */
  load();
  try{ if(localStorage.getItem(LS+".focus")){ $("#win").classList.add("focus"); $("#focusBtn").setAttribute("aria-pressed","true"); } }catch(e){}
  render();
  loadAPI();
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(location.protocol==="file:") toast("Open this page from a web address so YouTube can play inside it.");
})();
</script>
</body>
</html>
