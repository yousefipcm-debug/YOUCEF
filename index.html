<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My System">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My System</title>
<style>
  :root {
    --bg:#000000;--bg2:#1c1c1e;--bg3:#2c2c2e;--bg4:#3a3a3c;
    --text:#ffffff;--text2:#ebebf5cc;--text3:#ebebf599;--text4:#ebebf54d;
    --yellow:#ffd60a;--yellow-dim:#ffd60a33;
    --green:#30d158;--green-dim:#30d15833;
    --red:#ff453a;--red-dim:#ff453a33;
    --orange:#ff9f0a;--orange-dim:#ff9f0a33;
    --blue:#0a84ff;--blue-dim:#0a84ff33;
    --purple:#bf5af2;--purple-dim:#bf5af233;
    --pink:#ff375f;--white:#ffffff;
    --separator:#38383a;--radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;max-width:600px;margin:0 auto;padding-bottom:60px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 4px;position:sticky;top:0;background:var(--bg);z-index:100;}
  .header h1{font-size:34px;font-weight:700;letter-spacing:0.37px;}
  .header-icons{display:flex;gap:6px;}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--yellow);transition:all 0.15s;}
  .icon-btn:active{transform:scale(0.92);}
  .icon-btn svg{width:18px;height:18px;}
  .day-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;}
  .nav-arrow{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--yellow);transition:all 0.15s;}
  .nav-arrow:active{transform:scale(0.9);}
  .nav-arrow svg{width:15px;height:15px;}
  .day-center{text-align:center;}
  .day-label{font-size:22px;font-weight:700;}
  .day-sub{font-size:13px;color:var(--text3);margin-top:2px;}
  .today-pill{display:inline-block;background:var(--yellow);color:#000;font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;margin-top:6px;}
  .streak{margin:8px 20px;padding:10px 14px;background:var(--bg2);border-radius:var(--radius);display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--text2);}
  .streak-num{font-size:20px;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums;}
  .cat-section{margin-top:12px;}
  .cat-header{padding:6px 20px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;display:flex;align-items:center;justify-content:space-between;}
  .cat-header-left{display:flex;align-items:center;gap:6px;}
  .cat-note-btn{width:22px;height:22px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0.5;transition:opacity 0.15s;}
  .cat-note-btn:active,.cat-note-btn.has-note{opacity:1;}
  .cat-note-btn svg{width:14px;height:14px;}
  .cat-notes{display:none;margin:0 20px 4px;padding:10px 14px;background:var(--bg3);border-radius:8px;}
  .cat-notes.open{display:block;}
  .cat-notes textarea{width:100%;background:transparent;border:none;color:var(--text2);font-family:inherit;font-size:14px;resize:vertical;min-height:50px;outline:none;line-height:1.5;}
  .cat-card{margin:4px 20px;background:var(--bg2);border-radius:var(--radius);overflow:hidden;}
  .sub-cat-label{padding:8px 16px 2px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:var(--text4);}
  .task-row{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;transition:background 0.1s;user-select:none;}
  .task-row:active{background:var(--bg3);}
  .task-row+.task-row{border-top:1px solid var(--separator);}
  .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--text4);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .task-row.done .check{background:var(--green);border-color:var(--green);}
  .check svg{width:12px;height:12px;color:#fff;opacity:0;transition:opacity 0.15s;}
  .task-row.done .check svg{opacity:1;}
  .task-info{flex:1;min-width:0;}
  .task-title{font-size:16px;font-weight:400;color:var(--text);letter-spacing:-0.2px;}
  .task-row.done .task-title{color:var(--text4);text-decoration:line-through;}
  .task-bound{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--yellow);margin-top:2px;font-variant-numeric:tabular-nums;}
  .task-bound svg{width:12px;height:12px;flex-shrink:0;}
  .task-free-label{font-size:12px;color:var(--text4);margin-top:2px;}
  .task-del{width:22px;height:22px;border-radius:50%;border:none;background:var(--red-dim);color:var(--red);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .prayer-bar{margin:16px 20px;background:var(--bg2);border-radius:var(--radius);overflow:hidden;}
  .prayer-bar-title{padding:10px 16px 4px;font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;}
  .prayer-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;}
  .prayer-row+.prayer-row{border-top:1px solid var(--separator);}
  .prayer-name{font-size:15px;font-weight:500;color:var(--text2);}
  .prayer-time{font-size:14px;color:var(--text3);font-variant-numeric:tabular-nums;}
  .add-btn{display:flex;align-items:center;gap:8px;margin:12px 20px;padding:12px 16px;border:none;border-radius:var(--radius);background:var(--bg2);color:var(--yellow);font-size:15px;font-weight:500;cursor:pointer;width:calc(100% - 40px);font-family:inherit;}
  .add-btn:active{background:var(--bg3);}
  .add-btn svg{width:16px;height:16px;}
  .score-box{margin:16px 20px;padding:16px;background:var(--bg2);border-radius:var(--radius);text-align:center;cursor:pointer;}
  .score-box:active{background:var(--bg3);}
  .score-lbl{font-size:13px;color:var(--text3);font-weight:500;}
  .score-hint{font-size:12px;color:var(--text4);margin-top:4px;}
  .score-num{font-size:36px;font-weight:700;margin-top:4px;display:none;font-variant-numeric:tabular-nums;}
  .score-box.open .score-num{display:block;}
  .score-box.open .score-hint{display:none;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:flex-end;justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:600px;padding:24px 20px 32px;max-height:85dvh;overflow-y:auto;animation:sheetUp 0.25s ease;}
  @keyframes sheetUp{from{transform:translateY(100%);}}
  .sheet-bar{width:36px;height:5px;background:var(--bg4);border-radius:3px;margin:0 auto 16px;}
  .sheet h2{font-size:20px;font-weight:700;margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field-lbl{display:block;font-size:13px;color:var(--text3);font-weight:600;margin-bottom:6px;}
  .field-input{width:100%;padding:12px 14px;border:none;border-radius:10px;background:var(--bg3);color:var(--text);font-size:16px;font-family:inherit;outline:none;}
  .field-input:focus{box-shadow:0 0 0 2px var(--yellow);}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{padding:8px 16px;border-radius:20px;border:1.5px solid var(--bg4);background:transparent;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--text2);transition:all 0.15s;}
  .pill.on{border-color:var(--yellow);background:var(--yellow-dim);color:var(--yellow);}
  .sheet-submit{width:100%;padding:14px;border:none;border-radius:12px;background:var(--yellow);color:#000;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;}
  .sheet-submit:active{opacity:0.85;}
  .color-row{display:flex;gap:10px;flex-wrap:wrap;}
  .color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.15s;}
  .color-dot.on{border-color:var(--text);transform:scale(1.15);}
  .view{display:none;}
  .view.on{display:block;}
  .back-bar{display:flex;align-items:center;gap:12px;padding:12px 20px 4px;position:sticky;top:0;background:var(--bg);z-index:100;}
  .back-bar h1{font-size:28px;font-weight:700;}
  .chart-wrap{padding:20px;}
  .chart-label{font-size:15px;font-weight:600;color:var(--text2);margin-bottom:16px;}
  .bars{display:flex;align-items:flex-end;gap:6px;height:150px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .bar{width:100%;border-radius:6px 6px 0 0;min-height:4px;background:var(--bg3);transition:height 0.3s;}
  .bar.best{background:var(--yellow);}
  .bar.is-today{background:var(--text2);}
  .bar-pct{font-size:11px;color:var(--text3);font-weight:600;font-variant-numeric:tabular-nums;}
  .bar-day{font-size:12px;color:var(--text4);font-weight:500;}
  .best-card{margin:12px 20px;padding:14px 16px;background:var(--yellow-dim);border-radius:var(--radius);display:flex;align-items:center;gap:12px;}
  .best-card .bc-label{font-size:14px;color:var(--yellow);font-weight:600;}
  .best-card .bc-val{font-size:22px;color:var(--yellow);font-weight:700;}
  .year-toggle{display:flex;margin:0 20px 12px;background:var(--bg2);border-radius:var(--radius);overflow:hidden;}
  .year-toggle button{flex:1;padding:10px;border:none;background:transparent;color:var(--text3);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s;}
  .year-toggle button.active{background:var(--bg3);color:var(--yellow);}
  .year-cal{padding:0 20px 20px;}
  .month-block{margin-bottom:16px;}
  .month-name{font-size:13px;font-weight:600;color:var(--text3);margin-bottom:6px;}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .day-cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--text4);cursor:pointer;}
  .day-cell.has-data{color:var(--text);}
  .day-cell.score-high{background:var(--green-dim);color:var(--green);}
  .day-cell.score-mid{background:var(--yellow-dim);color:var(--yellow);}
  .day-cell.score-low{background:var(--red-dim);color:var(--red);}
  .day-cell.selected{outline:2px solid var(--yellow);}
  .day-detail{margin:8px 20px;padding:14px 16px;background:var(--bg2);border-radius:var(--radius);}
  .day-detail-title{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:6px;}
  .day-detail-score{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
  .day-detail-tasks{font-size:13px;color:var(--text3);margin-top:4px;}
  .s-section{padding:0 20px;margin-top:20px;}
  .s-section h3{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;}
  .s-card{background:var(--bg2);border-radius:var(--radius);overflow:hidden;}
  .s-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;}
  .s-row:active{background:var(--bg3);}
  .s-row+.s-row{border-top:1px solid var(--separator);}
  .s-row-left{flex:1;}
  .s-row-name{font-size:16px;font-weight:400;color:var(--text);}
  .s-row-sub{font-size:12px;color:var(--text3);margin-top:2px;}
  .s-row-val{font-size:14px;color:var(--text3);font-variant-numeric:tabular-nums;}
  .s-row-arrow{color:var(--text4);margin-left:8px;font-size:14px;}
  .s-row-del{width:26px;height:26px;border-radius:50%;border:none;background:var(--red-dim);color:var(--red);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-left:8px;}
  .s-row-color{width:16px;height:16px;border-radius:50%;margin-right:10px;flex-shrink:0;}
  .add-cat-btn{width:100%;padding:12px;border:1.5px dashed var(--bg4);border-radius:var(--radius);background:transparent;color:var(--yellow);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:8px;}
  .reset-btn{width:100%;padding:14px;border:1.5px solid var(--red);border-radius:var(--radius);background:transparent;color:var(--red);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:20px;}
  .reset-btn:active{background:var(--red-dim);}

  /* THOUGHTS */
  .thoughts-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;}
  .thoughts-date{font-size:16px;font-weight:600;color:var(--text2);text-align:center;}
  .thoughts-area{padding:0 20px;margin-top:8px;}
  .thoughts-editor{
    width:100%;min-height:45dvh;background:var(--bg2);border:none;
    border-radius:var(--radius);padding:16px;color:var(--text);
    font-family:inherit;font-size:16px;line-height:1.7;
    resize:none;outline:none;letter-spacing:-0.1px;
  }
  .thoughts-editor::placeholder{color:var(--text4);}
  .thoughts-editor:focus{box-shadow:0 0 0 1px var(--separator);}
  .thoughts-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;}
  .thoughts-count{font-size:12px;color:var(--text4);}
  .thoughts-clear{background:none;border:none;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;padding:4px 8px;}
  .thoughts-history-title{padding:20px 20px 8px;font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.8px;}
  .thought-item{margin:4px 20px;padding:14px 16px;background:var(--bg2);border-radius:var(--radius);cursor:pointer;}
  .thought-item:active{background:var(--bg3);}
  .thought-item-date{font-size:12px;color:var(--text3);margin-bottom:4px;}
  .thought-item-preview{font-size:14px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  /* TOMORROW */
  .tmr-date{text-align:center;padding:8px 20px;font-size:16px;font-weight:600;color:var(--yellow);}
  .tmr-tasks{margin:0 20px 12px;background:var(--bg2);border-radius:var(--radius);padding:14px 16px;}
  .tmr-tasks-title{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;}
  .tmr-task{font-size:14px;color:var(--text2);padding:4px 0;display:flex;align-items:center;gap:8px;}
  .tmr-task-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

  @media(min-width:601px){body{border-left:1px solid var(--separator);border-right:1px solid var(--separator);}}
</style>
</head>
<body>
<div class="view on" id="vDaily">
  <div class="header"><h1>System</h1><div class="header-icons">
    <button class="icon-btn" onclick="go('thoughts')" title="Thoughts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="13" y2="13"/></svg></button>
    <button class="icon-btn" onclick="go('tomorrow')" title="Tomorrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></button>
    <button class="icon-btn" onclick="go('weekly')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
    <button class="icon-btn" onclick="go('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div></div>
  <div class="day-nav">
    <button class="nav-arrow" onclick="move(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="day-center"><div class="day-label" id="dName"></div><div class="day-sub" id="dDate"></div><span class="today-pill" id="dToday" style="display:none">TODAY</span></div>
    <button class="nav-arrow" onclick="move(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
  <div class="streak" id="streakBar" style="display:none"><span>🔥</span><span>Overall streak: <span class="streak-num" id="streakN">0</span> days</span></div>
  <div id="taskArea"></div>
  <button class="add-btn" onclick="openAdd()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add custom task</button>
  <div class="prayer-bar"><div class="prayer-bar-title">Prayer Times</div><div id="prayerList"></div></div>
  <div class="score-box" id="scoreBox" onclick="this.classList.toggle('open')"><div class="score-lbl">Daily Score</div><div class="score-hint">tap to reveal</div><div class="score-num" id="scoreNum">0%</div></div>
</div>
<div class="view" id="vWeekly">
  <div class="back-bar"><button class="icon-btn" onclick="go('daily')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button><h1>History</h1></div>
  <div class="year-toggle"><button class="active" id="tabWeek" onclick="showTab('week')">This Week</button><button id="tabYear" onclick="showTab('year')">Year Calendar</button></div>
  <div id="weekContent"><div class="chart-wrap"><div class="chart-label">This Week's Scores</div><div class="bars" id="chartBars"></div></div><div id="bestArea"></div></div>
  <div id="yearContent" style="display:none"><div class="year-cal" id="yearCal"></div><div id="dayDetail"></div></div>
</div>
<div class="view" id="vSettings">
  <div class="back-bar"><button class="icon-btn" onclick="go('daily')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button><h1>Settings</h1></div>
  <div class="s-section"><h3>Prayer Times — Blida</h3><div class="s-card" id="sPrayers"></div></div>
  <div class="s-section"><h3>Categories</h3><div class="s-card" id="sCats"></div><button class="add-cat-btn" onclick="openCatEdit()">+ Add Category</button></div>
  <div class="s-section"><h3>Habits</h3><div class="s-card" id="sHabits"></div></div>
  <div class="s-section"><button class="reset-btn" onclick="resetAll()">Reset All Data</button></div>
</div>
<div class="view" id="vThoughts">
  <div class="back-bar"><button class="icon-btn" onclick="go('daily')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button><h1>💭 Thoughts</h1></div>
  <div class="thoughts-nav">
    <button class="nav-arrow" onclick="prevThought()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="thoughts-date" id="thoughtDate"></div>
    <button class="nav-arrow" onclick="nextThought()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
  <div class="thoughts-area">
    <textarea class="thoughts-editor" id="thoughtsEditor" placeholder="Dump your thoughts here...&#10;&#10;What's on your mind?&#10;What do you need to plan?&#10;What's bothering you?&#10;Just write..." oninput="saveThought()"></textarea>
  </div>
  <div class="thoughts-footer">
    <span class="thoughts-count" id="thoughtCount">0 words</span>
    <button class="thoughts-clear" onclick="clearThought()">Clear</button>
  </div>
  <div class="thoughts-history-title">Recent Notes</div>
  <div id="thoughtHistory"></div>
</div>
<div class="view" id="vTomorrow">
  <div class="back-bar"><button class="icon-btn" onclick="go('daily')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button><h1>Tomorrow's Prep</h1></div>
  <div class="tmr-date" id="tmrDate"></div>
  <div class="tmr-tasks" id="tmrTasks"></div>
  <div class="thoughts-area">
    <textarea class="thoughts-editor" id="tmrEditor" placeholder="Plan tomorrow...&#10;&#10;What needs to get done?&#10;Meetings? Calls?&#10;What to prepare tonight?" oninput="saveTmr()"></textarea>
  </div>
  <div class="thoughts-footer">
    <span class="thoughts-count" id="tmrCount">0 words</span>
    <button class="thoughts-clear" onclick="clearTmr()">Clear</button>
  </div>
</div>
<div class="overlay" id="mAdd"><div class="sheet"><div class="sheet-bar"></div><h2>Add Task</h2>
  <div class="field"><label class="field-lbl">Name</label><input class="field-input" id="fName" placeholder="Task name"></div>
  <div class="field"><label class="field-lbl">Category</label><div class="pill-row" id="fCats"></div></div>
  <div id="fSubCatField" style="display:none"><div class="field"><label class="field-lbl">Sub-category</label><div class="pill-row" id="fSubCats"></div></div></div>
  <div class="field"><label class="field-lbl">Duration (minutes)</label><input class="field-input" id="fDur" type="number" placeholder="30" min="1"></div>
  <div class="field"><label class="field-lbl">Type</label><div class="pill-row" id="fType"><button class="pill on" data-v="free" onclick="setAddType('free')">Free</button><button class="pill" data-v="bounded" onclick="setAddType('bounded')">Bounded</button></div></div>
  <div id="fTimeFields" style="display:none"><div class="field"><label class="field-lbl">Start Time</label><input class="field-input" id="fStart" type="time"></div><div class="field"><label class="field-lbl">End Time</label><input class="field-input" id="fEnd" type="time"></div></div>
  <button class="sheet-submit" onclick="saveAdd()">Add Task</button></div></div>
<div class="overlay" id="mPrayer"><div class="sheet"><div class="sheet-bar"></div><h2 id="mpTitle">Edit Prayer</h2><div class="field"><label class="field-lbl">Time</label><input class="field-input" id="mpTime" type="time"></div><button class="sheet-submit" onclick="savePrayer()">Save</button></div></div>
<div class="overlay" id="mHabit"><div class="sheet"><div class="sheet-bar"></div><h2>Edit Habit</h2>
  <div class="field"><label class="field-lbl">Name</label><input class="field-input" id="mhName"></div>
  <div class="field"><label class="field-lbl">Duration (minutes)</label><input class="field-input" id="mhDur" type="number" min="1"></div>
  <div class="field"><label class="field-lbl">Type</label><div class="pill-row" id="mhType"><button class="pill" data-v="free" onclick="setType('free')">Free</button><button class="pill" data-v="bounded" onclick="setType('bounded')">Bounded</button></div></div>
  <div id="mhTimeFields" style="display:none"><div class="field"><label class="field-lbl">Start Time</label><input class="field-input" id="mhStart" type="time"></div><div class="field"><label class="field-lbl">End Time</label><input class="field-input" id="mhEnd" type="time"></div></div>
  <div class="field"><label class="field-lbl">Days</label><div class="pill-row" id="mhDays"></div></div>
  <button class="sheet-submit" onclick="saveHabit()">Save</button></div></div>
<div class="overlay" id="mCat"><div class="sheet"><div class="sheet-bar"></div><h2 id="mcTitle">Add Category</h2>
  <div class="field"><label class="field-lbl">Name</label><input class="field-input" id="mcName" placeholder="Category name"></div>
  <div class="field"><label class="field-lbl">Color</label><div class="color-row" id="mcColors"></div></div>
  <div class="field"><label class="field-lbl">Sub-categories (comma separated, optional)</label><input class="field-input" id="mcSubs" placeholder="e.g. Working Time, Managing Time"></div>
  <button class="sheet-submit" onclick="saveCat()">Save</button></div></div>

<script>
const DAYS=['Friday','Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday'];
const DSHORT=['Fri','Sat','Sun','Mon','Tue','Wed','Thu'];
const COLORS=['#ff453a','#0a84ff','#30d158','#ff9f0a','#bf5af2','#ffd60a','#ff375f','#ffffff'];

const DEF_CATS=[
  {id:'spiritual',name:'Spiritual',color:'#30d158',subs:[]},
  {id:'fitness',name:'Fitness',color:'#ff453a',subs:[]},
  {id:'learning',name:'Learning',color:'#0a84ff',subs:[]},
  {id:'work',name:'Work',color:'#bf5af2',subs:['Working Time','Managing Time']},
  {id:'daily_fixed',name:'Daily Fixed',color:'#ebebf599',subs:[]},
];
const DEF_PRAYERS={fajr:'04:30',dhuhr:'12:45',asr:'16:15',maghrib:'19:30',isha:'21:00'};
const DEF_HABITS=[
  {id:'h2',name:'Quran Wird (20 pages)',cat:'spiritual',sub:'',days:[0,1,2,3,4,5,6],dur:40,bounded:true,start:'04:45',end:'05:25'},
  {id:'h3',name:'Morning Adhkar',cat:'spiritual',sub:'',days:[0,1,2,3,4,5,6],dur:10,bounded:true,start:'04:30',end:'04:45'},
  {id:'h4',name:'Evening Adhkar',cat:'spiritual',sub:'',days:[0,1,2,3,4,5,6],dur:10,bounded:true,start:'16:15',end:'16:25'},
  {id:'h5',name:'Halqa',cat:'spiritual',sub:'',days:[1,5],dur:60,bounded:false},
  {id:'h6',name:'Gym',cat:'fitness',sub:'',days:[0,1,4],dur:90,bounded:true,start:'06:00',end:'07:30'},
  {id:'h7',name:"Talab al-'ilm",cat:'learning',sub:'',days:[0,3,6],dur:30,bounded:false},
  {id:'h8',name:'Reading',cat:'learning',sub:'',days:[1,2,4],dur:30,bounded:false},
];

function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v));}

let cats=ld('cats2',DEF_CATS);
let prayers=ld('sp2',DEF_PRAYERS);
let habits=ld('sh2',DEF_HABITS);
let comp=ld('sc2',{});
let customs=ld('sx2',{});
let notes=ld('sn2',{});
let cur=new Date();
let addCat='spiritual',addSub='',addBounded=false;
let editPrayerKey='',editHabitId='',editBounded=false,editDays=[];
let editCatId=null,editCatColor=COLORS[0];

function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function di(d){const m={5:0,6:1,0:2,1:3,2:4,3:5,4:6};return m[d.getDay()];}
function isToday(d){return dk(d)===dk(new Date());}
function fmtDate(d){const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return d.getDate()+' '+mo[d.getMonth()]+' '+d.getFullYear();}
function t12(t){if(!t)return'';const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM');}
function durStr(m){if(!m)return'';if(m>=60){const h=Math.floor(m/60);const r=m%60;return r?h+'h '+r+'min':h+'h';}return m+' min';}
function getCat(id){return cats.find(c=>c.id===id);}

function render(){
  const key=dk(cur),dayIdx=di(cur);
  document.getElementById('dName').textContent=DAYS[dayIdx];
  document.getElementById('dDate').textContent=fmtDate(cur);
  document.getElementById('dToday').style.display=isToday(cur)?'inline-block':'none';
  document.getElementById('scoreBox').classList.remove('open');
  calcStreak();
  const area=document.getElementById('taskArea');area.innerHTML='';
  const dayComp=comp[key]||{};
  for(const cat of cats){
    const ch=habits.filter(h=>h.cat===cat.id&&h.days.includes(dayIdx));
    const cc=(customs[key]||[]).filter(c=>c.cat===cat.id);
    if(ch.length===0&&cc.length===0)continue;
    const sec=document.createElement('div');sec.className='cat-section';
    const noteKey=key+'_'+cat.id;
    const hasNote=notes[noteKey]&&notes[noteKey].trim();
    sec.innerHTML=`<div class="cat-header"><div class="cat-header-left"><span style="color:${cat.color}">${cat.name}</span></div>
      <button class="cat-note-btn ${hasNote?'has-note':''}" style="color:${cat.color}" onclick="toggleNote('${cat.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </button></div>`;
    const nd=document.createElement('div');nd.className='cat-notes';nd.id='note_'+cat.id;
    nd.innerHTML=`<textarea placeholder="Notes for ${cat.name}..." oninput="saveNote('${cat.id}',this.value)">${notes[noteKey]||''}</textarea>`;
    sec.appendChild(nd);
    const card=document.createElement('div');card.className='cat-card';
    if(cat.subs&&cat.subs.length>0){
      for(const sub of cat.subs){
        const sh=ch.filter(h=>(h.sub||'')===sub);const scx=cc.filter(c=>(c.sub||'')===sub);
        if(sh.length===0&&scx.length===0)continue;
        const lbl=document.createElement('div');lbl.className='sub-cat-label';lbl.textContent=sub;card.appendChild(lbl);
        for(const h of sh)card.appendChild(mkRow(h.id,h.name,h.dur,dayComp[h.id],false,h.bounded,h.start,h.end));
        for(const c of scx)card.appendChild(mkRow(c.id,c.name,c.dur,dayComp[c.id],true,c.bounded,c.start,c.end));
      }
      const ns=ch.filter(h=>!h.sub||!cat.subs.includes(h.sub));
      const nc=cc.filter(c=>!c.sub||!cat.subs.includes(c.sub));
      for(const h of ns)card.appendChild(mkRow(h.id,h.name,h.dur,dayComp[h.id],false,h.bounded,h.start,h.end));
      for(const c of nc)card.appendChild(mkRow(c.id,c.name,c.dur,dayComp[c.id],true,c.bounded,c.start,c.end));
    }else{
      for(const h of ch)card.appendChild(mkRow(h.id,h.name,h.dur,dayComp[h.id],false,h.bounded,h.start,h.end));
      for(const c of cc)card.appendChild(mkRow(c.id,c.name,c.dur,dayComp[c.id],true,c.bounded,c.start,c.end));
    }
    sec.appendChild(card);area.appendChild(sec);
  }
  const pl=document.getElementById('prayerList');pl.innerHTML='';
  for(const p of['fajr','dhuhr','asr','maghrib','isha']){const r=document.createElement('div');r.className='prayer-row';r.innerHTML='<span class="prayer-name">'+p.charAt(0).toUpperCase()+p.slice(1)+'</span><span class="prayer-time">'+t12(prayers[p])+'</span>';pl.appendChild(r);}
  updateScore();
}

function mkRow(id,name,dur,done,isCustom,bounded,start,end){
  const row=document.createElement('div');row.className='task-row'+(done?' done':'');
  let ti='';
  if(bounded&&start&&end)ti=`<div class="task-bound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${t12(start)} – ${t12(end)}</div>`;
  else if(dur)ti=`<div class="task-free-label">${durStr(dur)} · anytime</div>`;
  row.innerHTML=`<div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><div class="task-info"><div class="task-title">${name}</div>${ti}</div>${isCustom?'<button class="task-del" onclick="event.stopPropagation();delCustom(\''+id+'\')">✕</button>':''}`;
  row.onclick=()=>toggle(id);return row;
}

function toggleNote(catId){const el=document.getElementById('note_'+catId);el.classList.toggle('open');if(el.classList.contains('open'))el.querySelector('textarea').focus();}
function saveNote(catId,val){notes[dk(cur)+'_'+catId]=val;sv('sn2',notes);}
function toggle(id){const key=dk(cur);if(!comp[key])comp[key]={};comp[key][id]=!comp[key][id];sv('sc2',comp);render();}
function delCustom(id){const key=dk(cur);if(customs[key]){customs[key]=customs[key].filter(c=>c.id!==id);sv('sx2',customs);if(comp[key]){delete comp[key][id];sv('sc2',comp);}render();}}
function updateScore(){
  const key=dk(cur),dayIdx=di(cur),all=[];
  for(const h of habits){if(h.days.includes(dayIdx))all.push(h.id);}
  for(const c of(customs[key]||[]))all.push(c.id);
  if(all.length===0){document.getElementById('scoreNum').textContent='—';return;}
  const dc=comp[key]||{},done=all.filter(id=>dc[id]).length,pct=Math.round(done/all.length*100);
  const el=document.getElementById('scoreNum');el.textContent=pct+'%';
  el.style.color=pct>=80?'var(--green)':pct>=50?'var(--orange)':'var(--red)';
}
function move(dir){cur=new Date(cur.getTime()+dir*864e5);render();}
function calcStreak(){
  let s=0,d=new Date();const tT=getTasks(d),tC=comp[dk(d)]||{};
  if(!(tT.length>0&&tT.every(id=>tC[id])))d=new Date(d.getTime()-864e5);
  for(let i=0;i<365;i++){const tasks=getTasks(d),c=comp[dk(d)]||{};if(tasks.length===0){d=new Date(d.getTime()-864e5);continue;}if(tasks.every(id=>c[id])){s++;d=new Date(d.getTime()-864e5);}else break;}
  document.getElementById('streakN').textContent=s;document.getElementById('streakBar').style.display=s>0?'flex':'none';
}
function getTasks(date){const idx=di(date),key=dk(date),ids=[];for(const h of habits){if(h.days.includes(idx))ids.push(h.id);}for(const c of(customs[key]||[]))ids.push(c.id);return ids;}
function getScore(date){const tasks=getTasks(date),c=comp[dk(date)]||{};if(tasks.length===0)return-1;return Math.round(tasks.filter(id=>c[id]).length/tasks.length*100);}

// ADD CUSTOM
function setAddType(t){addBounded=t==='bounded';document.querySelectorAll('#fType .pill').forEach(p=>p.classList.toggle('on',p.dataset.v===t));document.getElementById('fTimeFields').style.display=addBounded?'block':'none';}
function openAdd(){document.getElementById('mAdd').classList.add('open');document.getElementById('fName').value='';document.getElementById('fDur').value='';document.getElementById('fStart').value='';document.getElementById('fEnd').value='';setAddType('free');addSub='';renderAddCats();}
function renderAddCats(){
  const c=document.getElementById('fCats');c.innerHTML='';
  for(const cat of cats){const p=document.createElement('button');p.className='pill'+(cat.id===addCat?' on':'');p.textContent=cat.name;p.onclick=()=>{addCat=cat.id;addSub='';renderAddCats();};c.appendChild(p);}
  const ac=getCat(addCat),sf=document.getElementById('fSubCatField');
  if(ac&&ac.subs&&ac.subs.length>0){sf.style.display='block';const sc=document.getElementById('fSubCats');sc.innerHTML='';
    for(const s of ac.subs){const p=document.createElement('button');p.className='pill'+(s===addSub?' on':'');p.textContent=s;p.onclick=()=>{addSub=s;renderAddCats();};sc.appendChild(p);}
  }else{sf.style.display='none';}
}
function saveAdd(){
  const name=document.getElementById('fName').value.trim();if(!name)return;
  const dur=parseInt(document.getElementById('fDur').value)||null,key=dk(cur);
  if(!customs[key])customs[key]=[];
  const task={id:'c'+Date.now(),name,cat:addCat,sub:addSub,dur,bounded:addBounded};
  if(addBounded){task.start=document.getElementById('fStart').value||null;task.end=document.getElementById('fEnd').value||null;}
  customs[key].push(task);sv('sx2',customs);document.getElementById('mAdd').classList.remove('open');render();
}

// PRAYER
function openPrayer(key){editPrayerKey=key;document.getElementById('mpTitle').textContent=key.charAt(0).toUpperCase()+key.slice(1);document.getElementById('mpTime').value=prayers[key];document.getElementById('mPrayer').classList.add('open');}
function savePrayer(){const v=document.getElementById('mpTime').value;if(v){prayers[editPrayerKey]=v;sv('sp2',prayers);document.getElementById('mPrayer').classList.remove('open');render();renderSettings();}}

// HABIT
function setType(t){editBounded=t==='bounded';document.querySelectorAll('#mhType .pill').forEach(p=>p.classList.toggle('on',p.dataset.v===t));document.getElementById('mhTimeFields').style.display=editBounded?'block':'none';}
function openHabitEdit(id){const h=habits.find(x=>x.id===id);if(!h)return;editHabitId=id;document.getElementById('mhName').value=h.name;document.getElementById('mhDur').value=h.dur||'';document.getElementById('mhStart').value=h.start||'';document.getElementById('mhEnd').value=h.end||'';setType(h.bounded?'bounded':'free');renderHabitDays(h.days);document.getElementById('mHabit').classList.add('open');}
function renderHabitDays(days){editDays=[...days];const c=document.getElementById('mhDays');c.innerHTML='';for(let i=0;i<7;i++){const p=document.createElement('button');p.className='pill'+(editDays.includes(i)?' on':'');p.textContent=DSHORT[i];p.onclick=()=>{if(editDays.includes(i))editDays=editDays.filter(x=>x!==i);else editDays.push(i);renderHabitDays(editDays);};c.appendChild(p);}}
function saveHabit(){const h=habits.find(x=>x.id===editHabitId);if(!h)return;h.name=document.getElementById('mhName').value.trim()||h.name;h.dur=parseInt(document.getElementById('mhDur').value)||null;h.bounded=editBounded;if(editBounded){h.start=document.getElementById('mhStart').value||null;h.end=document.getElementById('mhEnd').value||null;}else{h.start=null;h.end=null;}h.days=[...editDays];sv('sh2',habits);document.getElementById('mHabit').classList.remove('open');render();renderSettings();}
function delHabit(id){if(confirm('Remove this habit?')){habits=habits.filter(h=>h.id!==id);sv('sh2',habits);render();renderSettings();}}

// CATEGORY
function openCatEdit(id){editCatId=id||null;const e=id?getCat(id):null;document.getElementById('mcTitle').textContent=e?'Edit Category':'Add Category';document.getElementById('mcName').value=e?e.name:'';document.getElementById('mcSubs').value=e&&e.subs?e.subs.join(', '):'';editCatColor=e?e.color:COLORS[0];renderColorPicker();document.getElementById('mCat').classList.add('open');}
function renderColorPicker(){const c=document.getElementById('mcColors');c.innerHTML='';for(const col of COLORS){const d=document.createElement('div');d.className='color-dot'+(col===editCatColor?' on':'');d.style.background=col;d.onclick=()=>{editCatColor=col;renderColorPicker();};c.appendChild(d);}}
function saveCat(){const name=document.getElementById('mcName').value.trim();if(!name)return;const sr=document.getElementById('mcSubs').value;const subs=sr?sr.split(',').map(s=>s.trim()).filter(Boolean):[];if(editCatId){const cat=getCat(editCatId);if(cat){cat.name=name;cat.color=editCatColor;cat.subs=subs;}}else{cats.push({id:'cat_'+Date.now(),name,color:editCatColor,subs});}sv('cats2',cats);document.getElementById('mCat').classList.remove('open');render();renderSettings();}
function delCat(id){if(confirm('Delete this category?')){cats=cats.filter(c=>c.id!==id);habits=habits.filter(h=>h.cat!==id);sv('cats2',cats);sv('sh2',habits);render();renderSettings();}}

// SETTINGS
function renderSettings(){
  const sp=document.getElementById('sPrayers');sp.innerHTML='';
  for(const p of['fajr','dhuhr','asr','maghrib','isha']){const r=document.createElement('div');r.className='s-row';r.onclick=()=>openPrayer(p);r.innerHTML=`<div class="s-row-left"><div class="s-row-name">${p.charAt(0).toUpperCase()+p.slice(1)}</div></div><div class="s-row-val">${t12(prayers[p])}</div><span class="s-row-arrow">›</span>`;sp.appendChild(r);}
  const sc=document.getElementById('sCats');sc.innerHTML='';
  for(const cat of cats){const r=document.createElement('div');r.className='s-row';r.innerHTML=`<div class="s-row-color" style="background:${cat.color}"></div><div class="s-row-left" onclick="openCatEdit('${cat.id}')"><div class="s-row-name">${cat.name}</div><div class="s-row-sub">${cat.subs&&cat.subs.length?cat.subs.join(', '):''}</div></div><span class="s-row-arrow" onclick="openCatEdit('${cat.id}')">›</span><button class="s-row-del" onclick="event.stopPropagation();delCat('${cat.id}')">✕</button>`;sc.appendChild(r);}
  const sh=document.getElementById('sHabits');sh.innerHTML='';
  for(const h of habits){const dayStr=h.days.length===7?'Every day':h.days.map(d=>DSHORT[d]).join(', ');const typeStr=h.bounded?'⏰ '+t12(h.start)+' – '+t12(h.end):'Anytime';const r=document.createElement('div');r.className='s-row';r.innerHTML=`<div class="s-row-left" onclick="openHabitEdit('${h.id}')"><div class="s-row-name">${h.name}</div><div class="s-row-sub">${dayStr}${h.dur?' · '+durStr(h.dur):''} · ${typeStr}</div></div><span class="s-row-arrow" onclick="openHabitEdit('${h.id}')">›</span>${h.fixed?'':'<button class="s-row-del" onclick="event.stopPropagation();delHabit(\''+h.id+'\')">✕</button>'}`;sh.appendChild(r);}
}

// WEEKLY
function renderWeekly(){const today=new Date(),ds=di(today),start=new Date(today.getTime()-ds*864e5),bars=document.getElementById('chartBars');bars.innerHTML='';let best=-1,bestDay='';const data=[];for(let i=0;i<7;i++){const d=new Date(start.getTime()+i*864e5),pct=getScore(d),show=pct<0?0:pct;data.push({day:DSHORT[i],pct:show,date:d});if(show>best){best=show;bestDay=DAYS[i];}}for(const s of data){const col=document.createElement('div');col.className='bar-col';col.innerHTML=`<div class="bar-pct">${s.pct}%</div><div class="bar ${s.pct===best&&best>0?'best':''} ${isToday(s.date)?'is-today':''}" style="height:${Math.max(s.pct*1.4,4)}px"></div><div class="bar-day">${s.day}</div>`;bars.appendChild(col);}document.getElementById('bestArea').innerHTML=best>0?`<div class="best-card"><span style="font-size:22px">🏆</span><div><div class="bc-label">Best Day — ${bestDay}</div><div class="bc-val">${best}%</div></div></div>`:'';}

// YEAR
let selectedYearDay=null;
function renderYear(){const cal=document.getElementById('yearCal');cal.innerHTML='';const now=new Date(),sm=now.getMonth(),sy=now.getFullYear();for(let m=0;m<12;m++){let mo=sm-m,yr=sy;if(mo<0){mo+=12;yr--;}const block=document.createElement('div');block.className='month-block';const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];block.innerHTML=`<div class="month-name">${mn[mo]} ${yr}</div>`;const grid=document.createElement('div');grid.className='month-grid';for(const d of['F','S','S','M','T','W','T']){const h=document.createElement('div');h.style.cssText='font-size:10px;color:var(--text4);text-align:center;font-weight:600;';h.textContent=d;grid.appendChild(h);}const fd=new Date(yr,mo,1),dim=new Date(yr,mo+1,0).getDate(),jsD=fd.getDay(),map={5:0,6:1,0:2,1:3,2:4,3:5,4:6},offset=map[jsD];for(let i=0;i<offset;i++){grid.appendChild(document.createElement('div'));}for(let d=1;d<=dim;d++){const date=new Date(yr,mo,d),score=getScore(date),cell=document.createElement('div');cell.className='day-cell';if(score>=0){cell.classList.add('has-data');if(score>=80)cell.classList.add('score-high');else if(score>=50)cell.classList.add('score-mid');else cell.classList.add('score-low');}if(selectedYearDay&&dk(date)===selectedYearDay)cell.classList.add('selected');cell.textContent=d;cell.onclick=(()=>{const dt=new Date(date);return()=>selectYearDay(dt);})();grid.appendChild(cell);}block.appendChild(grid);cal.appendChild(block);}}
function selectYearDay(date){selectedYearDay=dk(date);renderYear();const detail=document.getElementById('dayDetail'),score=getScore(date),tasks=getTasks(date),dc=comp[dk(date)]||{},done=tasks.filter(id=>dc[id]).length;if(score<0)detail.innerHTML=`<div class="day-detail"><div class="day-detail-title">${fmtDate(date)}</div><div class="day-detail-tasks">No tasks</div></div>`;else detail.innerHTML=`<div class="day-detail"><div class="day-detail-title">${fmtDate(date)}</div><div class="day-detail-score" style="color:${score>=80?'var(--green)':score>=50?'var(--orange)':'var(--red)'}">${score}%</div><div class="day-detail-tasks">${done}/${tasks.length} completed</div></div>`;}
function showTab(tab){document.getElementById('tabWeek').classList.toggle('active',tab==='week');document.getElementById('tabYear').classList.toggle('active',tab==='year');document.getElementById('weekContent').style.display=tab==='week'?'block':'none';document.getElementById('yearContent').style.display=tab==='year'?'block':'none';if(tab==='year')renderYear();if(tab==='week')renderWeekly();}

function go(v){document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));document.getElementById('v'+v.charAt(0).toUpperCase()+v.slice(1)).classList.add('on');if(v==='weekly'){renderWeekly();showTab('week');}if(v==='settings')renderSettings();if(v==='daily')render();if(v==='thoughts')renderThoughts();if(v==='tomorrow')renderTmr();window.scrollTo(0,0);}

// THOUGHTS
let thoughts=ld('th2',{});
let thoughtDate=new Date();

function renderThoughts(){
  const key=dk(thoughtDate);
  document.getElementById('thoughtDate').textContent=fmtDate(thoughtDate);
  const editor=document.getElementById('thoughtsEditor');
  editor.value=thoughts[key]||'';
  updateWordCount();
  renderThoughtHistory();
}

function saveThought(){
  const key=dk(thoughtDate);
  const val=document.getElementById('thoughtsEditor').value;
  if(val.trim()){thoughts[key]=val;}else{delete thoughts[key];}
  sv('th2',thoughts);
  updateWordCount();
}

function clearThought(){
  if(confirm('Clear today\'s thoughts?')){
    delete thoughts[dk(thoughtDate)];
    sv('th2',thoughts);
    document.getElementById('thoughtsEditor').value='';
    updateWordCount();
    renderThoughtHistory();
  }
}

function updateWordCount(){
  const val=document.getElementById('thoughtsEditor').value.trim();
  const words=val?val.split(/\s+/).length:0;
  document.getElementById('thoughtCount').textContent=words+' word'+(words!==1?'s':'');
}

function prevThought(){thoughtDate=new Date(thoughtDate.getTime()-864e5);renderThoughts();}
function nextThought(){thoughtDate=new Date(thoughtDate.getTime()+864e5);renderThoughts();}

function renderThoughtHistory(){
  const hist=document.getElementById('thoughtHistory');hist.innerHTML='';
  const keys=Object.keys(thoughts).sort().reverse().slice(0,10);
  for(const key of keys){
    if(key===dk(thoughtDate))continue;
    const val=thoughts[key];if(!val||!val.trim())continue;
    const d=document.createElement('div');d.className='thought-item';
    const parts=key.split('-');
    const date=new Date(parts[0],parts[1]-1,parts[2]);
    const preview=val.substring(0,120).replace(/\n/g,' ');
    d.innerHTML=`<div class="thought-item-date">${fmtDate(date)}</div><div class="thought-item-preview">${preview}${val.length>120?'...':''}</div>`;
    d.onclick=()=>{thoughtDate=new Date(date);renderThoughts();window.scrollTo(0,0);};
    hist.appendChild(d);
  }
}
// TOMORROW PREP
let tmrNotes=ld('tmr2',{});

function renderTmr(){
  const tmr=new Date(new Date().getTime()+864e5);
  const key=dk(tmr);
  const dayIdx=di(tmr);
  document.getElementById('tmrDate').textContent=DAYS[dayIdx]+' · '+fmtDate(tmr);

  // Show tomorrow's scheduled tasks
  const container=document.getElementById('tmrTasks');
  const tmrHabits=habits.filter(h=>h.days.includes(dayIdx));
  let html='<div class="tmr-tasks-title">Scheduled for tomorrow</div>';
  if(tmrHabits.length===0){html+='<div style="font-size:14px;color:var(--text4)">No habits scheduled</div>';}
  else{
    for(const h of tmrHabits){
      const cat=getCat(h.cat);
      const color=cat?cat.color:'var(--text3)';
      const time=h.bounded&&h.start?t12(h.start):'anytime';
      html+=`<div class="tmr-task"><div class="tmr-task-dot" style="background:${color}"></div>${h.name} <span style="color:var(--text4);font-size:12px">· ${time}</span></div>`;
    }
  }
  container.innerHTML=html;

  // Load notes
  document.getElementById('tmrEditor').value=tmrNotes[key]||'';
  updateTmrCount();
}

function saveTmr(){
  const tmr=new Date(new Date().getTime()+864e5);
  const key=dk(tmr);
  const val=document.getElementById('tmrEditor').value;
  if(val.trim()){tmrNotes[key]=val;}else{delete tmrNotes[key];}
  sv('tmr2',tmrNotes);
  updateTmrCount();
}

function clearTmr(){
  if(confirm("Clear tomorrow's prep?")){
    const tmr=new Date(new Date().getTime()+864e5);
    delete tmrNotes[dk(tmr)];sv('tmr2',tmrNotes);
    document.getElementById('tmrEditor').value='';updateTmrCount();
  }
}

function updateTmrCount(){
  const val=document.getElementById('tmrEditor').value.trim();
  const words=val?val.split(/\s+/).length:0;
  document.getElementById('tmrCount').textContent=words+' word'+(words!==1?'s':'');
}

function resetAll(){if(confirm('Delete ALL data and start fresh?')){localStorage.clear();cats=DEF_CATS.map(c=>({...c,subs:[...c.subs]}));prayers={...DEF_PRAYERS};habits=DEF_HABITS.map(h=>({...h,days:[...h.days]}));comp={};customs={};notes={};thoughts={};tmrNotes={};sv('cats2',cats);sv('sp2',prayers);sv('sh2',habits);go('daily');}}
document.querySelectorAll('.overlay').forEach(o=>{o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
render();
</script>
